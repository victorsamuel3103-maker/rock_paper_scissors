<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 20px;
        }

        .game {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: #ffffff12;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 35px #0004;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .score {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            font-size: 18px;
        }

        .score strong {
            display: block;
            font-size: 30px;
            margin-top: 8px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            padding: 15px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.06);
        }

        .choice {
            background: white;
            font-size: 35px;
            width: 90px;
            height: 90px;
        }

        #result {
            min-height: 55px;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        #reset {
            background: #ffca28;
            color: #222;
            font-weight: bold;
            padding: 12px 25px;
        }
    </style>
</head>

<body>

    <div class="game">
        <h1>Rock Paper Scissors</h1>
        <p>Choose your move and challenge the computer!</p>

        <div class="score">
            <div>
                You
                <strong id="playerScore">0</strong>
            </div>

            <div>
                Computer
                <strong id="computerScore">0</strong>
            </div>
        </div>

        <div class="choices">
            <button class="choice" onclick="play('rock')">✊</button>
            <button class="choice" onclick="play('paper')">✋</button>
            <button class="choice" onclick="play('scissors')">✌️</button>
        </div>

        <div id="result">Make your first move!</div>

        <button id="reset" onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;

        function play(player) {
            const choices = ["rock", "paper", "scissors"];
            const computer = choices[
                Math.floor(Math.random() * choices.length)
            ];

            let message = "";

            if (player === computer) {
                message = "It's a tie!";
            } else if (
                (player === "rock" && computer === "scissors") ||
                (player === "paper" && computer === "rock") ||
                (player === "scissors" && computer === "paper")
            ) {
                playerScore++;
                message = "You win this round!";
            } else {
                computerScore++;
                message = "Computer wins this round!";
            }

            document.getElementById("result").textContent =
                `You chose ${player}. Computer chose ${computer}. ${message}`;

            document.getElementById("playerScore").textContent =
                playerScore;

            document.getElementById("computerScore").textContent =
                computerScore;
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;

            document.getElementById("playerScore").textContent = 0;
            document.getElementById("computerScore").textContent = 0;
            document.getElementById("result").textContent =
                "Make your first move!";
        }
    </script>

</body>
</html>
